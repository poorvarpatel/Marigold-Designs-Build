<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#58011c">
<meta name="robots" content="noindex">
<title>Client Login | Marigold Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
h1{font-family:"Josefin Sans",system-ui,sans-serif;font-weight:300;letter-spacing:.12em;font-size:24px}
.sub{margin:0 0 24px;font-size:15px;opacity:.8;letter-spacing:.06em}
label{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px;color:var(--ink)}
input{
  width:100%;
  font:inherit;
  font-weight:400;
  color:var(--ink);
  background:#fff;
  border:1px solid rgba(74,42,32,.25);
  border-radius:8px;
  padding:11px 12px;
}
input:focus-visible{outline:2px solid var(--burgundy);outline-offset:1px;border-color:transparent}
.button{width:100%;margin-top:24px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
.text-link{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--burgundy);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.text-link:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px}
.notice{
  margin:18px 0 0;
  padding:11px 13px;
  border-radius:8px;
  font-size:14px;
  display:none;
}
.notice.error{display:block;background:#fbe3e3;border:1px solid #e4b1b1;color:#7c001e}
.notice.info{display:block;background:#f3ecdf;border:1px solid #ddceae;color:#5c4326}
.back{margin-top:26px;font-size:14px}
.back a{color:var(--burgundy)}
</style>
<script src="config.js" defer></script>
  <script type="module" crossorigin src="/assets/login-BlZmdrLG.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/site-OPclLSaS.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-CLcXU_4U.js">
  <link rel="stylesheet" crossorigin href="/assets/site-DbityPoc.css">
</head>
<body>
<header class="topnav">
  <a class="brand" href="/" aria-label="Marigold Designs home"><img src="/assets/logo-horizontal-B8_auDSr.webp" alt="Marigold Designs" width="760" height="308"></a>
  <button id="menuBtn" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="mainnav"><span></span><span></span><span></span></button>
<nav id="mainnav" aria-label="Main navigation"><a href="/">Welcome</a><a href="/ourwork.html">Our Work</a><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/login.html">Login</a></nav>

</header>


<main class="card">
  <h1>Client login</h1>
  <p class="sub">Welcome back. Sign in to view your event.</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128">
    <button class="button" id="submit" type="submit">Sign in</button>
    <div class="row">
      <button class="text-link" id="forgot" type="button">Forgot password?</button>
    </div>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
  </form>
  <p class="back"><a href="/">← Back to marigoldesigns.com</a></p>
</main>

<footer>Marigold Designs · By Panna Patel</footer>

</body>
</html>
